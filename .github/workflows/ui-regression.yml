name: UI Regression Tests

on:
  schedule:
    - cron: "0 3 * * *"   # diario 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ui-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-rerunfailures allure-pytest

      - name: Run regression tests (with retries)
        env:
          HEADLESS: "true"
        run: |
          pytest -m regression \
            --reruns 2 \
            --reruns-delay 2 \
            --alluredir=allure-results

      - name: Ensure Allure results dir exists
        run: mkdir -p allure-results

      - name: Inject Allure environment (regression)
        run: |
          echo "Suite=Regression" >> allure-results/environment.properties
          echo "Branch=${GITHUB_REF_NAME}" >> allure-results/environment.properties
          echo "Commit=${GITHUB_SHA}" >> allure-results/environment.properties
          echo "RunNumber=${GITHUB_RUN_NUMBER}" >> allure-results/environment.properties
          echo "TriggeredBy=${GITHUB_EVENT_NAME}" >> allure-results/environment.properties

      - name: Inject Allure categories (smoke)
        run: |
          cp "$GITHUB_WORKSPACE/allure/categories.json" allure-results/categories.json

      - name: Download previous Allure history (regression)
        uses: actions/download-artifact@v4
        with:
          name: allure-history-regression
          path: allure-report/history
        continue-on-error: true

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Prepare GitHub Pages content (regression)
        run: |
          mkdir -p public/regression
          cp -r allure-report/* public/regression/

      - name: Upload Pages artifact (regression)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload Allure history artifact (regression)
        uses: actions/upload-artifact@v4
        with:
          name: allure-history-regression
          path: allure-report/history

  deploy-regression:
    needs: ui-regression
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Regression Allure report to GitHub Pages
        uses: actions/deploy-pages@v4