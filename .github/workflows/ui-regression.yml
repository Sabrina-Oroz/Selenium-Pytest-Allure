name: UI Regression Tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-rerunfailures allure-pytest

      - name: Run regression tests
        env:
          HEADLESS: "true"
        run: |
          pytest -m regression \
            -n auto \
            --reruns 2 \
            --reruns-delay 2 \
            --alluredir=allure-results

      # ---------- Allure metadata ----------
      - name: Inject Allure environment (regression)
        run: |
          echo "Suite=Regression" >> allure-results/environment.properties
          echo "Branch=${GITHUB_REF_NAME}" >> allure-results/environment.properties
          echo "Commit=${GITHUB_SHA}" >> allure-results/environment.properties
          echo "RunNumber=${GITHUB_RUN_NUMBER}" >> allure-results/environment.properties
          echo "TriggeredBy=${GITHUB_EVENT_NAME}" >> allure-results/environment.properties
          echo "OS=Linux" >> allure-results/environment.properties
          echo "Runner=ubuntu-latest" >> allure-results/environment.properties
          echo "Browser=Chrome" >> allure-results/environment.properties
          echo "Headless=true" >> allure-results/environment.properties

      - name: Inject Allure categories
        run: |
          cp reports/allure/categories.json allure-results/categories.json

      - name: Inject Allure executor (regression)
        run: |
          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "CI",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": "${{ github.run_number }}",
            "buildName": "Regression Tests",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      # ---------- Restore history from Pages ----------
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history (regression)
        run: |
          if [ -d gh-pages/regression/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/regression/history/* allure-results/history/
          fi

      # ---------- Allure ----------
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Prepare Pages content
        run: |
          mkdir -p public/regression
          cp -r allure-report/* public/regression/
          cp index.html public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: regression
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy Regression Allure report to GitHub Pages
        uses: actions/deploy-pages@v4