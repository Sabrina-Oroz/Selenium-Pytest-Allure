name: UI Tests - Smoke | Regression

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]

  pull_request:

  workflow_dispatch:
    inputs:
      test_type:
        description: "Tipo de tests a ejecutar"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression

jobs:
  ui-tests:
    name: UI Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        suite: [ smoke, regression ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #  DECISIÓN CENTRAL (bash real, sin parser roto)
      - name: Decide whether to run this suite
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ matrix.suite }}" == "smoke" ]]; then
            echo "RUN_SUITE=true" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.test_type }}" == "${{ matrix.suite }}" ]]; then
            echo "RUN_SUITE=true" >> $GITHUB_ENV
          else
            echo "RUN_SUITE=false" >> $GITHUB_ENV
          fi

      - name: Run tests
        if: env.RUN_SUITE == 'true'
        run: |
          pytest tests/${{ matrix.suite }} \
            -m ${{ matrix.suite }} \
            --alluredir=allure-results
        env:
          HEADLESS: true

      - name: Upload Allure results
        if: env.RUN_SUITE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          path: allure-results


  publish-allure:
    name: Publish Allure Reports
    runs-on: ubuntu-latest
    needs: ui-tests
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Smoke Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: artifacts/smoke/allure-results
        continue-on-error: true

      - name: Download Regression Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: artifacts/regression/allure-results
        continue-on-error: true

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Restore Allure history
        run: |
          if [ -d public/smoke/history ]; then
            mkdir -p artifacts/smoke/allure-results/history
            cp -r public/smoke/history artifacts/smoke/allure-results/history
          fi

          if [ -d public/regression/history ]; then
            mkdir -p artifacts/regression/allure-results/history
            cp -r public/regression/history artifacts/regression/allure-results/history
          fi

      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

      - name: Install Allure
        run: |
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Allure Reports
        run: |
          mkdir -p public/smoke public/regression

          if [ -d artifacts/smoke/allure-results ]; then
            allure generate artifacts/smoke/allure-results --clean -o public/smoke
          fi

          if [ -d artifacts/regression/allure-results ]; then
            allure generate artifacts/regression/allure-results --clean -o public/regression
          fi

      - name: Create index.html
        run: |
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>Allure Reports</title>
          </head>
          <body>
            <h1>Allure Reports</h1>
            <ul>
              <li><a href="smoke/">Smoke Tests</a></li>
              <li><a href="regression/">Regression Tests</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public