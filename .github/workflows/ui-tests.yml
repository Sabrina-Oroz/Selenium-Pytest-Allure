name: UI Tests - Smoke | Regression

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test suite to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression

env:
  PYTHON_VERSION: "3.12"
  ALLURE_RESULTS_DIR: allure-results

jobs:

  ui-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        suite: [ smoke, regression ]

    if: >
      github.event_name == 'push' && matrix.suite == 'smoke' ||
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.test_type == matrix.suite

    name: Run ${{ matrix.suite }} tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ${{ matrix.suite }} tests
        run: |
          pytest tests/${{ matrix.suite }} \
            --alluredir=${{ env.ALLURE_RESULTS_DIR }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          path: ${{ env.ALLURE_RESULTS_DIR }}

  publish-allure:
    needs: ui-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download Smoke Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: artifacts/smoke/allure-results
        continue-on-error: true

      - name: Download Regression Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: artifacts/regression/allure-results
        continue-on-error: true

      - name: Generate Allure Reports
        run: |
          for suite in smoke regression; do
            if [ -d artifacts/$suite/allure-results ]; then
              allure generate artifacts/$suite/allure-results \
                -o artifacts/$suite/allure-report --clean
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts