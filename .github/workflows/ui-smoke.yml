name: UI Smoke Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ui-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-rerunfailures allure-pytest

      - name: Run smoke tests (with retries)
        run: |
          pytest -m smoke \
            --reruns 2 \
            --reruns-delay 2 \
            --alluredir=allure-results

      #  Metadata simple (estable)
      - name: Inject Allure environment (smoke)
        run: |
          echo "Suite=Smoke" >> allure-results/environment.properties
          echo "Branch=${GITHUB_REF_NAME}" >> allure-results/environment.properties
          echo "Commit=${GITHUB_SHA}" >> allure-results/environment.properties
          echo "RunNumber=${GITHUB_RUN_NUMBER}" >> allure-results/environment.properties
          echo "TriggeredBy=${GITHUB_EVENT_NAME}" >> allure-results/environment.properties

      #  Categories (FIX definitivo)
      - name: Inject Allure categories (smoke)
        run: |
          cp allure/categories.json allure-results/categories.json

      - name: Download previous Allure history (smoke)
        uses: actions/download-artifact@v4
        with:
          name: allure-history-smoke
          path: allure-report/history
        continue-on-error: true

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Prepare GitHub Pages content (smoke)
        run: |
          mkdir -p public/smoke
          cp -r allure-report/* public/smoke/

      - name: Upload Pages artifact (smoke)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload Allure history artifact (smoke)
        uses: actions/upload-artifact@v4
        with:
          name: allure-history-smoke
          path: allure-report/history

  deploy-smoke:
    needs: ui-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Smoke Allure report to GitHub Pages
        uses: actions/deploy-pages@v4